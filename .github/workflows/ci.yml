name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/master' }}

      - name: Lint
        run: ./gradlew lint --no-daemon

      - name: Test
        run: ./gradlew test --no-daemon

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: app/build/test-results/**/*.xml

      - name: Upload lint results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-results
          path: app/build/reports/lint-results*.html

  dependency-submission:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    # Submitting a dependency snapshot writes to the repository's dependency
    # graph, which the default read-only GITHUB_TOKEN cannot do: the job failed
    # every run with "Resource not accessible by integration", and because it
    # is a job of the CI workflow that made the whole CI run red even though
    # the build and the APK were fine.
    permissions:
      contents: write
    # Even with the permission the API answers "The Dependency graph is
    # disabled for this repository", which is a REPOSITORY setting
    # (Settings > Advanced Security > Dependency graph), not something a
    # workflow can turn on. Until it is enabled this job cannot succeed, and a
    # supply-chain nicety must not be what makes the build look broken and
    # hides a real failure. Flip that setting and drop this line to make it a
    # hard gate again.
    continue-on-error: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Generate and submit dependency graph
        uses: gradle/actions/dependency-submission@v4
