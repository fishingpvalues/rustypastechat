exifinterface = "1.3.7"
work = "2.11.2"
hiltWork = "1.4.0"
# com.github.mwiede is the maintained JSch fork. The original com.jcraft:jsch
# is unmaintained since 2018, refuses every modern key exchange an OpenSSH 9
# server offers, and shipped the native .so that produced the META-INF/
# packaging conflict this project gave up on. The fork is pure Java.
jsch = "0.2.21"

